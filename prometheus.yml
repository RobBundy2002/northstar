global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: northstar-production-east
    metrics_path: /metrics
    params: { context: [production-east] }
    static_configs: [{ targets: ['host.docker.internal:5173'] }]
  - job_name: northstar-staging-west
    metrics_path: /metrics
    params: { context: [staging-west] }
    static_configs: [{ targets: ['host.docker.internal:5173'] }]
  - job_name: northstar-dev-sandbox
    metrics_path: /metrics
    params: { context: [dev-sandbox] }
    static_configs: [{ targets: ['host.docker.internal:5173'] }]
