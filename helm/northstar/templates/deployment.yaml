apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "northstar.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "northstar.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "northstar.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "northstar.name" . }}
    spec:
      serviceAccountName: {{ .Values.rbac.serviceAccountName }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: northstar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: NORTHSTAR_MODE
              value: kubernetes
            - name: NORTHSTAR_CONTEXT
              value: {{ .Values.context | quote }}
            - name: NORTHSTAR_READ_ONLY
              value: {{ .Values.readOnly | quote }}
            {{ if .Values.kubeconfigSecret }}
            - name: NORTHSTAR_KUBECONFIG
              value: /kube/config
            {{ end }}
            - name: NORTHSTAR_DATA_DIR
              value: /app/data
            - name: NORTHSTAR_PROMETHEUS_URL
              value: {{ .Values.prometheusUrl | quote }}
          volumeMounts:
            {{ if .Values.kubeconfigSecret }}
            - name: kubeconfig
              mountPath: /kube
              readOnly: true
            {{ end }}
            {{ if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/data
            {{ end }}
      volumes:
        {{ if .Values.kubeconfigSecret }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubeconfigSecret }}
        {{ end }}
        {{ if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "northstar.fullname" . }}-data
        {{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "northstar.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "northstar.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
