replicaCount: 1
image:
  repository: northstar
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 5173
context: production-east
readOnly: true
prometheusUrl: ""
# Optional. Leave empty to use the pod's ServiceAccount and in-cluster config.
kubeconfigSecret: ""
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
rbac:
  create: true
  mode: readonly
  serviceAccountName: northstar
