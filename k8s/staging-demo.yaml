apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-candidate
  namespace: northstar
  labels: { app: release-candidate }
spec:
  replicas: 2
  selector: { matchLabels: { app: release-candidate } }
  template:
    metadata: { labels: { app: release-candidate } }
    spec:
      containers:
        - name: preview
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
